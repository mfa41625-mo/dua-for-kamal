<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استغفار للمرحوم دكتور كمال فتحي أمين</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(160deg,#eef7f3,#f8fbfa);color:#17352d;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{width:min(92%,520px);background:#fff;border-radius:24px;padding:32px 22px;text-align:center;box-shadow:0 10px 35px #0002}
h1{font-size:27px;margin:8px 0 18px}
.dua{font-size:21px;line-height:1.9;margin:18px 0 24px}
button{border:0;border-radius:18px;padding:17px 24px;font-size:19px;background:#198754;color:white;cursor:pointer;box-shadow:0 6px 18px #19875455}
button:disabled{opacity:.6}
.count{margin-top:20px;font-size:19px}
.num{font-size:36px;font-weight:bold;display:block;margin-top:6px}
.small{margin-top:22px;color:#66756f;font-size:14px}
.status{font-size:13px;color:#777;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<main class="card">
<div style="font-size:44px">🤲</div>
<h1>استغفار للمرحوم<br>دكتور كمال فتحي أمين</h1>
<div class="dua">اللهم أغفر له و ارحمه واسكنه فسيح جناتك</div>
<button id="btn">اللهم أغفر له و ارحمه واسكنه فسيح جناتك</button>
<div class="count">عدد الاستغفارات الجماعي<span class="num" id="count">—</span></div>
<div class="status" id="status"></div>
<div class="small">صدقة جارية • شارك الرابط ليشارك غيرك في الدعاء له</div>
</main>
<script>
const URL="https://ndqoiukxnmrxzxbsvtbu.supabase.co", KEY="sb_publishable_JqGdmqWSykO1lu9z_vj-Jw_R2-Tyg4E";
const headers={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};
function showCount(n){document.getElementById("count").textContent=Number(n).toLocaleString("ar-EG");}
async function loadCount(){
  try{
    const r=await fetch(URL+"/rest/v1/istighfar?id=eq.1&select=count",{headers});
    if(!r.ok) throw new Error();
    const d=await r.json();
    showCount(d[0]?.count ?? 0);
  }catch(e){document.getElementById("status").textContent="تعذر تحميل العداد، حاول تحديث الصفحة.";}
}
async function increment(){
  const b=document.getElementById("btn");
  b.disabled=true;
  try{
    const r=await fetch(URL+"/rest/v1/rpc/increment_istighfar",{method:"POST",headers,body:"{}"});
    if(!r.ok) throw new Error();
    showCount(await r.json());
    document.getElementById("status").textContent="تم تسجيل الاستغفار 🤲";
  }catch(e){document.getElementById("status").textContent="لم يتم التسجيل، حاول مرة أخرى.";}
  finally{b.disabled=false;}
}
document.getElementById("btn").addEventListener("click",increment);
loadCount();
</script>
</body>
</html>
